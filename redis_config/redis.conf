# ============================================
# Redis Configuration with TLS/SSL Support
# ============================================

# Basic Settings
bind 0.0.0.0
port 0
protected-mode yes

# TLS/SSL Configuration
tls-port 6379
tls-cert-file /etc/redis/certs/server-cert.pem
tls-key-file /etc/redis/certs/server-key.pem
tls-ca-cert-file /etc/redis/certs/ca-cert.pem

# TLS Security Settings
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
tls-ciphers DEFAULT:!MEDIUM:!LOW:!aNULL:!eNULL:!MD5:!RC4:!DES:!3DES

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Save to Disk (RDB)
save 900 1
save 300 10
save 60 10000

# ACL (Access Control List)
aclfile /etc/redis/users.acl

# Memory Management
maxmemory-policy noeviction

# Logging
loglevel notice
logfile ""

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Timeout
timeout 0
tcp-keepalive 300

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance Tuning
hz 10
dynamic-hz yes
