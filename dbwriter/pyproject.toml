[tool.poetry]
name = "steam-spider-dbwriter"
version = "0.1.0"
description = "DB Writer (Batch Processor) for Steam-Spider distributed crawler"
authors = ["Steam-Spider Team"]
readme = "README.md"
packages = [{include = "dbwriter", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.0.0"
python-dateutil = "^2.8.2"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
freezegun = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dbwriter = "dbwriter.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
