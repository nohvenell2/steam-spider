[tool.poetry]
name = "steam-spider-producer"
version = "0.1.0"
description = "Producer component for Steam game data collection system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "producer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.0.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
flask = "^3.0.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
producer = "producer.main:main"
producer-dashboard = "producer.dashboard.app:main"
producer-reset-redis = "producer.cli.reset_redis:main"
producer-reset-db = "producer.cli.reset_db:main"
producer-reset-all = "producer.cli.reset_all:main"
producer-recover = "producer.cli.recover:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/producer --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
